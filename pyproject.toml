[project]
name = "sales-agent-demo"
version = "0.1.0"
description = "Drogaria Exemplo WhatsApp Agent (ADK)"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk>=2.6.3",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-firestore>=2.19.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.8",
    "respx>=0.21.0",
    "ruff>=0.4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
